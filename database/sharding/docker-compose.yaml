services:
  monolith_db:
    image: postgres:latest
    container_name: monolith_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mymonolithdatabase
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U myuser -d mymonolithdatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - m_pgdata:/var/lib/postgresql

volumes:
  m_pgdata: